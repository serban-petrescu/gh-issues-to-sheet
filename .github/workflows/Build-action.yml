name: Build action

on:
    push:
        branches: [field-parsing-patch]
    workflow_dispatch: {}

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - name: Build
              run: |
                  cd lib && npm ci
                  cd ../action && npm ci --install-links && npm run build
            - name: Publish to release branch
              run: |
                  cd action/dist
                  git init -q -b "${GITHUB_REF_NAME}-release"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
                  git add --all
                  git commit -q -m "chore(release): Build from ${GITHUB_SHA}"
                  git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:"${GITHUB_REF_NAME}-release"
